name: BRO console checks
on: [push, pull_request, workflow_dispatch]
env:
  ORT_DISABLE_TELEMETRY: "1"
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-serial python3-pil python3-opencv opencv-data xvfb
      - run: bash apps/BRO/install_audio.sh
      - run: BRO_AUDIO_TEST=1 "$HOME/.local/share/skycorepi/audio-venv/bin/python" -m unittest discover -s apps/BRO/tests -v
      - run: bash apps/BRO/install_vision.sh
      - run: BRO_VISION_TEST=1 "$HOME/.local/share/skycorepi/vision-venv/bin/python" -m unittest discover -s apps/BRO/tests -v
      - run: BRO_VISION_SPAWN_TEST=1 python3 -m unittest discover -s apps/BRO/tests -v
      - run: python3 -m unittest discover -s apps/BRO/tests -v
      - run: xvfb-run -a python3 apps/BRO/tests/gui_smoke.py
      - run: python3 -m py_compile app.py apps/BRO/*.py
      - uses: actions/upload-artifact@v4
        with:
          name: bro-preview
          path: /tmp/bloomface-preview.png
